# Railway config-as-code. Leave the dashboard start command empty so the
# image CMD runs scripts/docker-entrypoint.sh (prisma db push, then npm start).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
